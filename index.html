<style>
:root{--verde:#008069;--verde2:#25d366;--mio:#d9fdd3;--sfondo:#efeae2;--grigio:#667781;--riga:#e9edef;--blu:#53bdeb}

button{font:inherit;cursor:pointer}
input,textarea{font:inherit;font-size:16px}
.vista{display:none;flex-direction:column;height:100%;height:100dvh}
.vista.on{display:flex}
header{background:var(--verde);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 10px;
 padding-top:max(8px,env(safe-area-inset-top));min-height:56px;flex:none}

header button{background:none;border:0;color:#fff;font-size:21px;padding:4px 8px;border-radius:20px}
header button:active{background:rgba(255,255,255,.2)}
.scorre{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.scheda{max-width:380px;margin:30px auto;padding:20px;display:flex;flex-direction:column;gap:10px}

.scheda h2{text-align:center;margin:0 0 4px;color:var(--verde);font-size:21px}
.scheda p{color:var(--grigio);font-size:14px;margin:0}
label{font-size:13px;color:var(--grigio)}
.campo{width:100%;padding:11px;border:1px solid #ccd;border-radius:10px;background:#fff}
.primario{background:var(--verde);color:#fff;border:0;border-radius:22px;padding:12px;font-weight:600}

/* elenco chat */
.ricerca{padding:7px 10px;background:#fff;flex:none}
.ricerca input{width:100%;border:0;background:#f0f2f5;border-radius:18px;padding:9px 14px}
.filtri{display:flex;gap:6px;padding:0 10px 6px;overflow-x:auto;flex:none}

 display:inline-flex;align-items:center;justify-content:center;font-weight:600}

 color:#fff;font-weight:600;font-size:17px}

 background:var(--verde2);color:#fff;font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.25)}

/* chat */

 background-image:radial-gradient(rgba(0,0,0,.035) 1px,transparent 1px);background-size:18px 18px}

 word-wrap:break-word;overflow-wrap:anywhere;position:relative}
.mio .fumetto{background:var(--mio)}
.riga.primo:not(.mio) .fumetto{border-top-left-radius:0}

.fumetto .piede{float:right;font-size:11px;color:var(--grigio);margin:6px 0 -3px 10px;white-space:nowrap}

 color:#111b21;text-decoration:none;font-size:14.5px}
.fumetto img.foto{display:block;max-width:100%;max-height:300px;border-radius:6px;margin:1px 0 3px;min-width:120px;min-height:80px;
 background:#ddd;object-fit:cover}

.barra{display:flex;gap:6px;align-items:flex-end;padding:6px 6px;background:#f0f2f5;padding-bottom:max(6px,env(safe-area-inset-bottom));flex:none}
.barra .box{flex:1;display:flex;align-items:flex-end;background:#fff;border-radius:22px;padding:0 4px 0 6px}

#visore button{position:absolute;top:max(12px,env(safe-area-inset-top));color:#fff;background:rgba(0,0,0,.4);border:0;
 font-size:22px;border-radius:20px;padding:6px 12px}

<body>

<!-- 1) collegamento a Dropbox (una volta sola) -->
<section id="v-dropbox" class="vista"><div class="scheda">
 <img src="icona.png" alt=""><h2>Chat PEITIAN</h2>
 <p>Prima volta: collega il tuo Dropbox (quello dove c'è la chat del Gestionale).</p>
 <label>App key Dropbox (☰ Menu ▸ Account cloud… nel Gestionale)</label>
 <input id="d-key" class="campo" autocapitalize="none" autocomplete="off" spellcheck="false">
 <button class="secondario" id="d-apri">1 · Apri Dropbox e consenti</button>
 <label>2 · Incolla qui il codice che Dropbox ti mostra</label>

</div></section>

</div></section>

<!-- 3) elenco chat -->
<section id="v-home" class="vista">
 <header><h1>Chat PEITIAN</h1><button id="b-aggiorna" title="Aggiorna">⟳</button><button id="b-esci" title="Esci">⏻</button></header>
 <div class="ricerca"><input id="cerca" type="search" placeholder="Cerca chat e messaggi"></div>
 <div class="filtri" id="filtri"></div>

 </div>

</section>

<div id="foglio"><div class="pann" id="foglio-p"></div></div>
<div id="visore"><img id="visore-img" alt=""><button id="visore-x">✕</button></div>

<script>
"use strict";
// ======================================================================= impostazioni
const APP_KEY_FISSA = "keuy9srntbg6oo0";         // app Dropbox «Chat PEITIAN iPhone» (account info@, Dropbox completo)
// cartella della chat: con un'app «cartella dell'app» è "/Chat Gestionale Europeo"; con un'app «Dropbox completo»
// è dentro Applicazioni/Gestionale PEITIAN Europe. Si prova in quest'ordine e si ricorda quella trovata.
const RADICI = ["/Applicazioni/Gestionale PEITIAN Europe/Chat Gestionale Europeo", "/Apps/Gestionale PEITIAN Europe/Chat Gestionale Europeo",
  "/Chat Gestionale Europeo"];
let RADICE = ls_get("radice", RADICI[0]);
function ls_get(k, d) { try { const v = localStorage.getItem("cge_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } }
async function trovaRadice() {
  for (const r of [RADICE, ...RADICI.filter(x => x !== RADICE)]) {
    try { await rpc("files/get_metadata", {path: r + "/utenti.json"}); RADICE = r; ls.set("radice", r); return r; }
    catch (e) { if (e.stato !== 409) throw e; }
  }
  // ricerca in tutto il Dropbox (la cartella può essere altrove, per esempio condivisa)
  try {
    const r = await rpc("files/search_v2", {query: "utenti.json", options: {filename_only: true, max_results: 100}});
    for (const m of r.matches || []) {
      const md = m.metadata && m.metadata.metadata, p = md && md.path_display;
      if (p && /\/Chat Gestionale Europeo\/utenti\.json$/i.test(p)) { RADICE = p.slice(0, -"/utenti.json".length); ls.set("radice", RADICE); return RADICE; }
    }
  } catch (e) {}
  let cosa = "";
  try { const r = await elenca("", false); cosa = r.voci.map(v => v.name).slice(0, 15).join(", "); } catch (e) {}
  throw new Error("Non trovo la cartella «Chat Gestionale Europeo» in questo Dropbox. Cartelle presenti: " + (cosa || "nessuna") + ".");
}
const NOME_CENTRALE = "Peitian Europe";
const PC = "iPhone";
const ONLINE_S = 75, BATTITO_S = 50, SYNC_S = 5;
const API = location.search.includes("prova=") ? location.origin + "/finto" : "https://api.dropboxapi.com";
const CONTENUTI = location.search.includes("prova=") ? location.origin + "/finto" : "https://content.dropboxapi.com";
const IMG = /\.(jpe?g|png|gif|webp|heic|bmp)$/i;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const link = s => esc(s).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
const ls = {
  get(k, d) { try { const v = localStorage.getItem("cge_" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("cge_" + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem("cge_" + k); } catch (e) {} },
};
const pulisci = n => String(n || "").replace(/[<>:"/\\|?*\x00-\x1f]/g, "").trim().replace(/^\.+|\.+$/g, "").slice(0, 60);
function mostra(id) { document.querySelectorAll(".vista").forEach(v => v.classList.toggle("on", v.id === id)); }
function avviso(id, t) { const e = $(id); e.textContent = t || ""; e.style.display = t ? "block" : "none"; }

// ======================================================================= Dropbox
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const argAscii = o => JSON.stringify(o).replace(/[\u007f-￿]/g, c => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
let TOKEN = null, SCADE = 0;

async function token() {
  if (TOKEN && Date.now() < SCADE - 60000) return TOKEN;
  const rt = ls.get("refresh"), key = ls.get("app_key");
  if (!rt || !key) throw Object.assign(new Error("dropbox"), {dropbox: true});
  const r = await fetch(API + "/oauth2/token", {method: "POST", body: new URLSearchParams({grant_type: "refresh_token", refresh_token: rt, client_id: key})});
  if (!r.ok) { if (r.status === 400 || r.status === 401) { ls.del("refresh"); } throw Object.assign(new Error("dropbox"), {dropbox: true}); }
  const d = await r.json();
  TOKEN = d.access_token; SCADE = Date.now() + (d.expires_in || 14400) * 1000;
  return TOKEN;
}
async function rpc(endpoint, corpo) {
  for (let i = 0; ; i++) {
    const r = await fetch(API + "/2/" + endpoint, {method: "POST",
      headers: {"Authorization": "Bearer " + await token(), "Content-Type": "application/json"}, body: JSON.stringify(corpo)});
    if (r.status === 401 && i === 0) { TOKEN = null; continue; }
    if (r.status === 429 && i < 4) { await new Promise(f => setTimeout(f, 1500 * (i + 1))); continue; }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(d.error_summary || ("Dropbox " + r.status)), {stato: r.status, dati: d});
    return d;
  }
}
async function contenuto(endpoint, arg, corpo) {
  for (let i = 0; ; i++) {
    const h = {"Authorization": "Bearer " + await token(), "Dropbox-API-Arg": argAscii(arg)};
    if (corpo !== undefined) h["Content-Type"] = "application/octet-stream";
    const r = await fetch(CONTENUTI + "/2/" + endpoint, {method: "POST", headers: h, body: corpo});
    if (r.status === 401 && i === 0) { TOKEN = null; continue; }
    if (r.status === 429 && i < 4) { await new Promise(f => setTimeout(f, 1500 * (i + 1))); continue; }
    if (!r.ok) { const t = await r.text(); throw Object.assign(new Error(t.slice(0, 200) || ("Dropbox " + r.status)), {stato: r.status, testo: t}); }
    return r;
  }
}
async function scaricaTesto(path) {
  try {
    const r = await contenuto("files/download", {path});
    const meta = JSON.parse(r.headers.get("Dropbox-API-Result") || "{}");
    return {testo: await r.text(), rev: meta.rev};
  } catch (e) { if (e.stato === 409) return null; throw e; }
}
async function carica(path, dati, modo, rinomina) {
  const r = await contenuto("files/upload", {path, mode: modo || "overwrite", autorename: !!rinomina, mute: true}, dati);
  return r.json();
}
async function elenca(path, ricorsivo) {
  let d;
  try { d = await rpc("files/list_folder", {path, recursive: !!ricorsivo, include_deleted: false}); }
  catch (e) { if (e.stato === 409) return {voci: [], cursore: null}; throw e; }
  const voci = [...d.entries];
  while (d.has_more) { d = await rpc("files/list_folder/continue", {cursor: d.cursor}); voci.push(...d.entries); }
  return {voci, cursore: d.cursor};
}
async function cambiamenti(cursore) {
  let d = await rpc("files/list_folder/continue", {cursor: cursore});
  const voci = [...d.entries];
  while (d.has_more) { d = await rpc("files/list_folder/continue", {cursor: d.cursor}); voci.push(...d.entries); }
  return {voci, cursore: d.cursor};
}
async function aLotti(lavori, n) {        // esegue promesse con al massimo n in parallelo
  const out = []; let i = 0;
  await Promise.all(Array.from({length: Math.min(n, lavori.length)}, async () => { while (i < lavori.length) { const k = i++; out[k] = await lavori[k](); } }));
  return out;
}

// ======================================================================= collegamento Dropbox (PKCE, codice da incollare)
$("d-key").value = APP_KEY_FISSA.startsWith("__") ? ls.get("app_key", "") : APP_KEY_FISSA;
$("d-apri").onclick = async () => {
  const key = $("d-key").value.trim();
  if (!key) { $("d-errore").textContent = "Scrivi prima l'app key."; return; }
  const ver = b64url(crypto.getRandomValues(new Uint8Array(48)));
  const sfida = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(ver)));
  ls.set("pkce", ver); ls.set("app_key", key);
  const q = new URLSearchParams({client_id: key, response_type: "code", code_challenge: sfida, code_challenge_method: "S256", token_access_type: "offline"});
  window.open("https://www.dropbox.com/oauth2/authorize?" + q, "_blank");
};
$("d-collega").onclick = async () => {
  $("d-errore").textContent = "";
  const key = $("d-key").value.trim() || ls.get("app_key"), codice = $("d-codice").value.trim(), ver = ls.get("pkce");
  if (!key || !codice || !ver) { $("d-errore").textContent = "Apri prima Dropbox (punto 1) e incolla il codice."; return; }
  const r = await fetch(API + "/oauth2/token", {method: "POST", body: new URLSearchParams({code: codice, grant_type: "authorization_code", client_id: key, code_verifier: ver})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.refresh_token) { $("d-errore").textContent = "Dropbox non accetta il codice (" + (d.error_description || d.error || r.status) + "). Rifai il punto 1 e incolla il codice nuovo."; return; }
  ls.set("refresh", d.refresh_token); ls.del("pkce");
  TOKEN = d.access_token; SCADE = Date.now() + (d.expires_in || 14400) * 1000;
  $("d-codice").value = "";
  vaiLogin();
};
$("l-scollega").onclick = e => { e.preventDefault(); if (confirm("Scollegare Dropbox da questo telefono?")) { ls.del("refresh"); ls.del("sessione"); TOKEN = null; mostra("v-dropbox"); } };

// ======================================================================= accesso (utente e password del Gestionale)
async function pbkdf2(pw, saleB64) {
  const sale = Uint8Array.from(atob(saleB64), c => c.charCodeAt(0));
  const k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name: "PBKDF2", hash: "SHA-256", salt: sale, iterations: 200000}, k, 256));
}

function sedeAttuale(S, nome) { const a = (S.info.nomi_precedenti || []); return a.includes(nome) ? (S.info.nome || S.k) : nome; }

function canale(S, id) {

    S.canali[id] = {id, ris, nome, cart: (ris ? S.cart + " - Riservato" : S.cart) + "/canali/" + nome,

// ---- lettura iniziale e aggiornamenti incrementali
async function applica(voci, k, tipo, base) {
  const S = SEDI[k], scarica = [];
  for (const v of voci) {
    const p = v.path_display || v.path_lower || "";
    if (!p.toLowerCase().startsWith(base.toLowerCase() + "/")) continue;
    const rel = p.slice(base.length + 1).split("/");
    if (tipo === "presenza") {
      if (rel.length !== 1 || !rel[0].endsWith(".json")) continue;
      if (v[".tag"] === "deleted") { delete S.presenze[rel[0]]; continue; }
      if (v[".tag"] === "file") scarica.push(async () => { const f = await scaricaTesto(p); if (f) try { S.presenze[rel[0]] = JSON.parse(f.testo); } catch (e) {} });
      continue;
    }
    const id = (tipo === "riservato" ? "R:" : "") + rel[0];
    if (rel.length === 1) { if (v[".tag"] === "deleted") delete S.canali[id]; else if (v[".tag"] === "folder") canale(S, id); continue; }
    if (rel.length !== 2) continue;
    const C = canale(S, id), nf = rel[1];
    if (v[".tag"] === "deleted") { if (nf === "canale.json") { C.info = {}; C.haInfo = false; } else { delete C.files[nf]; C.sporco = true; } continue; }
    if (v[".tag"] !== "file") continue;
    if (nf === "canale.json") scarica.push(async () => { const f = await scaricaTesto(p); if (f) try { C.info = JSON.parse(f.testo) || {}; C.haInfo = true; } catch (e) {} });
    else if (nf.endsWith(".jsonl") && (!C.files[nf] || C.files[nf].rev !== v.rev))
      scarica.push(async () => { const f = await scaricaTesto(p); if (f) { C.files[nf] = f; C.sporco = true; } });
  }
  await aLotti(scarica, 6);
}
async function caricaTutto() {
  SEDI = {}; CURSORI = [];
  await trovaRadice();
  const rad = await elenca(RADICE, false);
  const cartelle = rad.voci.filter(v => v[".tag"] === "folder" && !v.name.endsWith(" - Riservato")).map(v => v.name);
  const info = await aLotti(cartelle.map(n => async () => { const f = await scaricaTesto(`${RADICE}/${n}/sede.json`); try { return f ? JSON.parse(f.testo) : null; } catch (e) { return null; } }), 6);
  cartelle.forEach((n, i) => {
    const inf = info[i];
    if (!inf) return;
    const chi = inf.visibile_a;
    if (chi && !chi.map(x => String(x).toLowerCase()).includes(IO.toLowerCase())) return;
    SEDI[n] = {k: n, cart: `${RADICE}/${n}`, info: inf, canali: {}, presenze: {}, utenti: []};
  });
  await aLotti(Object.values(SEDI).map(S => async () => {
    for (const [tipo, base] of [["canali", S.cart + "/canali"], ["riservato", S.cart + " - Riservato/canali"], ["presenza", S.cart + "/presenza"]]) {
      const r = await elenca(base, tipo !== "presenza");
      await applica(r.voci, S.k, tipo, base);
      if (r.cursore) CURSORI.push({path: base, cursore: r.cursore, k: S.k, tipo});
    }
    const u = await scaricaTesto(S.cart + "/utenti.json");
    try { S.utenti = u ? Object.keys(JSON.parse(u.testo)) : []; } catch (e) { S.utenti = []; }

let syncInCorso = null, ultimoSync = 0;
function sincronizza(forza) {
  if (syncInCorso) return syncInCorso;
  if (!forza && Date.now() - ultimoSync < (SYNC_S - 1) * 1000) return Promise.resolve(false);
  syncInCorso = (async () => {
    let cambiato = false;
    for (const c of CURSORI) {
      let r;
      try { r = await cambiamenti(c.cursore); }
      catch (e) {
        if (e.stato === 409) { const n = await elenca(c.path, c.tipo !== "presenza"); r = n; } else throw e;
      }
      if (r.voci.length) { cambiato = true; await applica(r.voci, c.k, c.tipo, c.path); }
      if (r.cursore) c.cursore = r.cursore;
    }
    for (const S of Object.values(SEDI)) for (const C of Object.values(S.canali)) ricostruisci(S, C);
    ultimoSync = Date.now();
    return cambiato;
  })().finally(() => { syncInCorso = null; });

}

// ---- scrittura (solo il proprio file .jsonl del canale)
async function scriviRiga(S, C, riga) {
  const nf = CHIAVE + ".jsonl", path = C.cart + "/" + nf;

    const prima = C.files[nf];
    const testo = (prima ? prima.testo : "") + JSON.stringify(riga) + "\n";

      const meta = await carica(path, new Blob([testo], {type: "application/octet-stream"}),
        prima ? {".tag": "update", "update": prima.rev} : {".tag": "add"});

    }

    await carica(S.cart + "/presenza/" + CHIAVE + ".json", new Blob([JSON.stringify(d, null, 1)]), "overwrite");

}

    $("c-sotto").textContent = (a ? a.sede + " · " : "") + (onl ? "online" : ult ? "ultimo accesso " + quando(ult) : "");
  } else {
    $("c-sotto").textContent = S.k + (on.length ? " · " + [...new Set(on.map(p => nomeBreve(p.utente)))].join(", ") + " online" : "");
  }
}
function testoMsg(S, C, m) {
  if (m.eliminato) return `<div class="t">🚫 Messaggio eliminato</div>`;
  let h = "";
  if (m.commessa) {
    const c = m.commessa;
    h += `<div class="t">📋 Commessa ${esc(c.numero || "")} «${esc(c.titolo || "")}»${c.evento === "creata" ? " creata" : ": stato " + esc(c.stato || "")}</div>`;
  }
  if (m.file) {
    const nome = m.file.split(/[\\/]/).pop(), p = C.fileDir + "/" + m.file.replace(/\\/g, "/");
    if (IMG.test(nome)) h += `<img class="foto" data-p="${esc(p)}" alt="${esc(nome)}" src="${FOTO[p] || ""}">`;
    else h += `<a class="file" href="#" data-p="${esc(p)}"><span style="font-size:24px">📄</span><span>${esc(nome)}</span></a>`;
  }
  if (m.testo) h += `<span class="t">${link(m.testo)}</span>`;
  return h;
}
function disegnaChat(inizio, evidenzia) {
  if (!CORR) return;
  const {S, C} = CORR, box = $("messaggi");
  const firma = C.msgs.length + "|" + (C.msgs.length ? C.msgs[C.msgs.length - 1].ts : 0) + "|" + C.msgs.reduce((a, m) => a + (m._ts_evento || 0), 0) + "|" + letture(S, C).join(",");
  if (!inizio && firma === CORR.firma) return;
  CORR.firma = firma;
  const inFondo = inizio || box.scrollHeight - box.scrollTop - box.clientHeight < 100;
  const [ric, let_] = letture(S, C);
  let g = "", prec = null, sepFatto = false, html = "";
  const msgs = C.msgs.slice(-400);
  if (!msgs.length) html = `<div class="vuoto">Nessun messaggio</div>`;
  for (const m of msgs) {
    const gg = giorno(m.ts || 0);
    if (gg !== g) { g = gg; prec = null; html += `<div class="giorno"><span>${esc(gg)}</span></div>`; }
    const mio = eMio(S, m);
    if (!sepFatto && !mio && (m.ts || 0) > CORR.primoNonLetto && CORR.primoNonLetto) { sepFatto = true; html += `<div class="nonletti-sep" id="sep-nl">Messaggi non letti</div>`; }
    const primo = !prec || prec.utente !== m.utente || prec.sede !== m.sede || (m.ts - prec.ts) > 600;
    const cls = "fumetto" + (m.eliminato ? " eliminato" : "") + (m.commessa ? " sistema" : "");
    const spunte = mio ? `<span class="spunte ${let_ >= m.ts ? "letto" : ""}">${ric >= m.ts ? "✓✓" : "✓"}</span>` : "";
    const chi = !mio && primo && !eDiretto(C) ? `<div class="chi" style="color:${colore(m.utente)}">${esc(m.utente)} <span style="color:#8696a0;font-weight:400">· ${esc(m.sede || "")}</span></div>` : "";
    html += `<div class="riga${mio ? " mio" : ""}${primo ? " primo" : ""}" data-id="${esc(m.id)}"><div class="${cls}">${chi}${testoMsg(S, C, m)}` +
      `<span class="piede">${m.modificato ? "modificato · " : ""}${ora(m.ts || 0)}${spunte}</span></div></div>`;
    prec = m;
  }
  box.innerHTML = html;
  box.querySelectorAll("img.foto").forEach(img => { if (!img.getAttribute("src")) miniatura(img); });
  if (evidenzia) {
    const e = box.querySelector(`[data-id="${CSS.escape(evidenzia)}"] .fumetto`);
    if (e) { e.scrollIntoView({block: "center"}); e.classList.add("evidenza"); }
  } else if (inizio && $("sep-nl")) $("sep-nl").scrollIntoView({block: "start"});
  else if (inFondo) box.scrollTop = box.scrollHeight;
  segnaLetto(S, C);
}
async function miniatura(img) {
  const p = img.dataset.p;
  if (FOTO[p]) { img.src = FOTO[p]; return; }
  try {
    const r = await contenuto("files/get_thumbnail_v2", {resource: {".tag": "path", path: p}, format: "jpeg", size: "w640h480", mode: "fitone_bestfit"});
    FOTO[p] = URL.createObjectURL(await r.blob());
    const box = $("messaggi"), giu = box.scrollHeight - box.scrollTop - box.clientHeight < 150;
    img.onload = () => { if (giu) box.scrollTop = box.scrollHeight; };
    img.src = FOTO[p];
  } catch (e) { img.replaceWith(Object.assign(document.createElement("span"), {className: "t", textContent: "📷 " + img.alt})); }
}
$("messaggi").addEventListener("click", async e => {
  const a = e.target.closest("a.file"), img = e.target.closest("img.foto");
  if (a || img) {
    e.preventDefault();
    const p = (a || img).dataset.p;
    if (img && FOTO[p]) { $("visore-img").src = FOTO[p]; $("visore").classList.add("on"); history.pushState({v: "foto"}, ""); return; }
    const w = window.open("", "_blank");            // aperta subito: Safari blocca le finestre aperte dopo un'attesa
    try { const d = await rpc("files/get_temporary_link", {path: p}); if (w) w.location = d.link; else location.href = d.link; }
    catch (err) { if (w) w.close(); alert("File non trovato su Dropbox."); }
    return;
  }
  if (e.target.closest("a")) return;
  const r = e.target.closest(".riga");
  if (r && CORR) azioni(CORR.C.msgs.find(m => m.id === r.dataset.id));
});
$("visore-x").onclick = () => history.back();
function foglio(voci) {
  const p = $("foglio-p"); p.innerHTML = "";
  for (const [t, f, rosso] of voci) {
    const b = document.createElement("button"); b.textContent = t; if (rosso) b.className = "rosso";
    b.onclick = () => { $("foglio").classList.remove("on"); f && f(); };
    p.appendChild(b);
  }
  $("foglio").classList.add("on");
}
$("foglio").onclick = e => { if (e.target.id === "foglio") $("foglio").classList.remove("on"); };
function azioni(m) {
  if (!m || m.eliminato) return;
  const {S, C} = CORR, voci = [];
  if (m.testo && navigator.clipboard) voci.push(["Copia", () => navigator.clipboard.writeText(m.testo)]);
  if (eMio(S, m) && !m.commessa) {
    voci.push(["Modifica", async () => {
      const t = prompt("Modifica il messaggio:", m.testo || "");
      if (t === null || !t.trim() || t.trim() === m.testo) return;
      try { await evento(S, C, "modifica", m.id, {testo: t.trim()}); disegnaChat(false); } catch (e) { alert(e.message); }
    }]);
    voci.push(["Elimina per tutti", async () => {
      if (!confirm("Eliminare questo messaggio per tutti?")) return;
      try { await evento(S, C, "elimina", m.id); disegnaChat(false); } catch (e) { alert(e.message); }
    }, true]);
  }
  if (!voci.length) return;
  voci.push(["Annulla", null]);
  foglio(voci);
}
$("b-invia").onclick = async () => {
  const t = $("m-testo").value.trim(); if (!t || !CORR) return;
  $("m-testo").value = ""; altezza();
  try { await invia(CORR.S, CORR.C, t.slice(0, 20000)); disegnaChat(false); $("messaggi").scrollTop = $("messaggi").scrollHeight; }
  catch (e) { $("m-testo").value = t; altezza(); alert("Messaggio non inviato: " + e.message); }
};
$("m-testo").addEventListener("input", altezza);
function altezza() { const t = $("m-testo"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 130) + "px"; }
$("b-allega").onclick = () => $("f-file").click();
$("b-foto").onclick = () => $("f-foto").click();
async function allega(files) {
  if (!CORR) return;
  const {S, C} = CORR;
  let nota = $("m-testo").value.trim(); $("m-testo").value = ""; altezza();
  for (const f of files) {
    avviso("avviso-chat", "Invio di " + f.name + "…");
    try {
      let nome = pulisci(f.name) || "file";
      if (/^image\.(jpe?g|png|heic)$/i.test(nome)) { const d = new Date(), z = n => String(n).padStart(2, "0");
        nome = `Foto ${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())} ${z(d.getHours())}.${z(d.getMinutes())}.${z(d.getSeconds())}` + nome.slice(5); }
      const meta = await carica(C.fileDir + "/Allegati chat/" + nome, f, {".tag": "add"}, true);
      const rel = meta.path_display.slice(C.fileDir.length + 1);
      await invia(S, C, nota, rel); nota = "";
    } catch (e) { alert(f.name + ": " + e.message); }
  }
  avviso("avviso-chat", ""); disegnaChat(false); $("messaggi").scrollTop = $("messaggi").scrollHeight;
}
$("f-file").onchange = () => { const f = [...$("f-file").files]; $("f-file").value = ""; allega(f); };
$("f-foto").onchange = () => { const f = [...$("f-foto").files]; $("f-foto").value = ""; allega(f); };
$("b-indietro").onclick = () => history.back();
document.querySelectorAll(".indietro").forEach(b => b.onclick = () => history.back());
window.onpopstate = () => {
  if ($("visore").classList.contains("on")) { $("visore").classList.remove("on"); return; }
  $("foglio").classList.remove("on");
  CORR = null; mostra("v-home"); disegnaElenco();
};

// ======================================================================= nuova chat diretta
$("b-nuova").onclick = () => {
  const el = $("persone"); el.innerHTML = `<div class="gruppo">Scrivi in privato a</div>`;
  const pers = [];
  for (const S of Object.values(SEDI)) for (const u of S.utenti) pers.push([S, u]);
  pers.sort((a, b) => a[0].k.localeCompare(b[0].k) || a[1].localeCompare(b[1]));
  let g = null;
  for (const [S, u] of pers) {
    if (S.k !== g) { g = S.k; el.insertAdjacentHTML("beforeend", `<div class="gruppo" style="color:#667781">${esc(g)}</div>`); }
    const onl = online(S).some(p => stessaPersona(S, p, u, S.k));
    const v = document.createElement("div"); v.className = "voce";
    v.innerHTML = avatar(u) + `<div class="corpo"><div class="su"><span class="nome">${esc(u)}</span></div><div class="giu"><span class="ant">${onl ? "🟢 online" : esc(S.k)}</span></div></div>`;
    v.onclick = async () => { try { const id = await apriDiretto(S, u, S.k); history.back(); setTimeout(() => apriChat(S.k, id), 60); } catch (e) { alert(e.message); } };
    el.appendChild(v);
  }
  if (!pers.length) el.insertAdjacentHTML("beforeend", `<div class="vuoto">Nessuna persona</div>`);
  mostra("v-persone"); history.pushState({v: "persone"}, "");
};
async function apriDiretto(S, utente, sede) {
  for (const C of Object.values(S.canali))
    if (eDiretto(C) && partecipanti(C).some(p => stessaPersona(S, p, utente, sede)) && partecipanti(C).some(p => stessaPersona(S, p, IO, NOME_CENTRALE))) {
      if (C.info.archiviato) { C.info = {...C.info, archiviato: false, modificato: Date.now() / 1000, da: IO}; await carica(C.cart + "/canale.json", new Blob([JSON.stringify(C.info, null, 1)]), "overwrite"); }
      return C.id;
    }
  const io = [IO, NOME_CENTRALE], lui = [utente, sedeAttuale(S, sede)];
  const firma = [io, lui].map(([u, s]) => `${u.toLowerCase()}@${s.toLowerCase()}`).sort().join("|");
  const sha = [...new Uint8Array(await crypto.subtle.digest("SHA-1", new TextEncoder().encode(firma)))].map(b => b.toString(16).padStart(2, "0")).join("");
  const id = "DM " + sha.slice(0, 12), C = canale(S, id);
  const info = {diretto: true, creato: Date.now() / 1000, da: IO, partecipanti: [{utente: io[0], sede: io[1]}, {utente: lui[0], sede: lui[1]}]};
  try { await carica(C.cart + "/canale.json", new Blob([JSON.stringify(info, null, 1)]), {".tag": "add"}); }
  catch (e) { if (e.stato !== 409) throw e; }
  C.info = info; C.haInfo = true;
  return id;
}

// ======================================================================= avvio e ciclo
let timer = null, ultimoBattito = 0;
function fermaTimer() { clearInterval(timer); timer = null; }
async function aggiornaOra(forza) {
  try {
    await sincronizza(forza);
    avviso("avviso-home", ""); if (CORR) avviso("avviso-chat", "");
    if (Date.now() - ultimoBattito > BATTITO_S * 1000) { ultimoBattito = Date.now(); battito("online").catch(() => {}); }
    if (CORR) { disegnaChat(false); sottotitolo(); } else if ($("v-home").classList.contains("on") && !$("cerca").value) disegnaElenco();
  } catch (e) {
    if (e.dropbox) { fermaTimer(); mostra("v-dropbox"); return; }
    avviso(CORR ? "avviso-chat" : "avviso-home", "Connessione assente, riprovo…");
  }
}
async function avvia() {
  const s = ls.get("sessione");
  IO = s.utente; CHIAVE = pulisci(IO + "__" + PC);
  LETTI = ls.get("letti_" + IO, null);
  mostra("v-home"); $("elenco").innerHTML = `<div class="vuoto">Caricamento della chat da Dropbox…</div>`;
  try { await caricaTutto(); }
  catch (e) { if (e.dropbox) { mostra("v-dropbox"); return; } $("elenco").innerHTML = `<div class="vuoto">Errore: ${esc(e.message)}<br><br><button class="secondario" onclick="avvia()">Riprova</button></div>`; return; }
  if (!LETTI) {                     // primo accesso: quello che c'è già conta come letto
    LETTI = {};
    for (const S of Object.values(SEDI)) for (const C of Object.values(S.canali)) if (C.msgs.length) LETTI[S.k + "|" + C.id] = C.msgs[C.msgs.length - 1].ts || 0;
    ls.set("letti_" + IO, LETTI);
  }
  ultimoSync = Date.now();
  disegnaFiltri(); disegnaElenco();
  ultimoBattito = Date.now(); battito("online").catch(() => {});
  fermaTimer(); timer = setInterval(() => { if (document.visibilityState === "visible") aggiornaOra(false); }, SYNC_S * 1000);
}
document.addEventListener("visibilitychange", () => {
  if (!IO || !ls.get("sessione")) return;
  if (document.visibilityState === "visible") aggiornaOra(true);
  else battito("offline").catch(() => {});
});
(function inizio() {
  // collegato con un'altra app Dropbox (la vecchia del Gestionale): va ricollegato con quella giusta
  if (!APP_KEY_FISSA.startsWith("__") && ls.get("app_key") && ls.get("app_key") !== APP_KEY_FISSA) { ls.del("refresh"); ls.set("app_key", APP_KEY_FISSA); }
  if (!ls.get("refresh")) { mostra("v-dropbox"); return; }
  const s = ls.get("sessione");
  if (!s || s.scade < Date.now()) { vaiLogin(); return; }
  avvia();
})();
